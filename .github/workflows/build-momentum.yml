# PrivateLab 3.1 - Momentum GitHub Actions, compatible with flattened GitHub uploads.
# Builds an external .fap app; does not flash or modify firmware.
name: Build PrivateLab for Momentum

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      channel:
        description: Momentum SDK matching your Flipper firmware
        type: choice
        options:
          - release
          - dev
        required: true
        default: release

permissions:
  contents: read

jobs:
  build:
    name: Test and build Momentum FAP
    runs-on: ubuntu-24.04
    steps:
      - name: Check out files
        uses: actions/checkout@v4

      - name: Fix folder structure for flat GitHub uploads
        shell: bash
        run: |
          set -euo pipefail
          if [ -f applications_user/private_lab/application.fam ]; then
            echo 'App already has the expected directory layout.'
            exit 0
          fi

          echo 'Preparing the original PrivateLab files uploaded in the root folder...'
          for file in application.fam icon.png private_lab.c obd_parser.c obd_parser.h \
                      test_obd.c test_report.py report.py mock.h \
                      furi.h furi_hal.h gui.h canvas.h view_port.h \
                      input.h storage.h expansion.h; do
            if [ ! -f "$file" ]; then
              echo "::error::Missing $file in repository root. Upload the complete PrivateLab project ZIP contents."
              exit 1
            fi
          done

          mkdir -p applications_user/private_lab tests/mock_sdk/gui \
                   tests/mock_sdk/input tests/mock_sdk/storage \
                   tests/mock_sdk/expansion desktop
          cp application.fam icon.png private_lab.c obd_parser.c obd_parser.h \
             applications_user/private_lab/
          cp test_obd.c test_report.py tests/
          cp report.py desktop/
          cp mock.h furi.h furi_hal.h tests/mock_sdk/
          cp gui.h tests/mock_sdk/gui/gui.h
          cp canvas.h tests/mock_sdk/gui/canvas.h
          cp view_port.h tests/mock_sdk/gui/view_port.h
          cp input.h tests/mock_sdk/input/input.h
          cp storage.h tests/mock_sdk/storage/storage.h
          cp expansion.h tests/mock_sdk/expansion/expansion.h
          echo 'Folder structure ready.'

      - name: Run PrivateLab host tests
        shell: bash
        run: |
          set -euo pipefail
          # Invoking Bash directly avoids permission denied (exit 126) on GitHub uploads.
          bash test_host.sh

      - name: Compile app using Momentum SDK
        id: build_app
        uses: flipperdevices/flipperzero-ufbt-action@v0.1
        with:
          app-dir: applications_user/private_lab
          sdk-index-url: https://up.momentum-fw.dev/firmware/directory.json
          sdk-channel: ${{ inputs.channel || 'release' }}
          ufbt-args: ''

      - name: Inspect built files
        shell: bash
        run: |
          set -euo pipefail
          find applications_user/private_lab/dist -type f -name '*.fap' -print -exec sha256sum {} \;

      - name: Upload installable FAP
        uses: actions/upload-artifact@v4
        with:
          name: PrivateLab-Momentum-${{ steps.build_app.outputs.suffix }}
          path: ${{ steps.build_app.outputs.fap-artifacts }}
          if-no-files-found: error
          retention-days: 30
